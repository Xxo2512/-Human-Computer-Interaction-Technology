# 全局配置 - 所有成员的代码都从这里读参数
# 修改这个文件前先和组内同步,避免复现不一致

project:
  name: "eeg-emotion-deap"
  seed: 42

paths:
  data_raw: "data/raw"
  data_preproc: "data/preproc"
  data_epochs: "data/epochs"
  features: "features"
  models: "models"
  figs: "reports/figs"

dataset:
  name: "DEAP"
  version: "original_bdf"   # 使用原始 .bdf 版本,自己做完整预处理
  sfreq_original: 512       # DEAP 原始采样率
  sfreq_target: 256         # ICA/训练前降采样目标(512->256,ICA 快 4 倍)
  n_channels_eeg: 32        # EEG 通道数
  n_channels_total: 48      # 含 8 路外周(EOG/EMG 等) + 8 路其他;实际以 P1 探测为准
  n_trials: 40              # 每被试 40 段视频
  trial_duration_s: 60      # 刺激时长
  baseline_duration_s: 3    # 预刺激基线
  # DEAP 触发码(来自官方 readme.txt):
  # 1=start of experiment, 2=video sync, 3=fixation, 4=music start,
  # 5=video start, 7=end of video, 8=end of experiment
  event_id_video_start: 4

preprocess:
  # 原始版需要的完整流水线
  resample_to: 256          # 第一步降采样,加速后续
  bandpass:
    l_freq: 1.0             # 原始数据从 1Hz 起去慢漂和直流,比预处理版 4Hz 更保守
    h_freq: 50.0            # 去 50Hz 前先低通到 50(notch 会扣掉)
  notch_freq: 50.0          # 工频陷波
  reref: "average"          # 平均参考
  ica:
    n_components: 20
    random_state: 42
    method: "fastica"
    # DEAP 原始 bdf 里的外周通道(索引 33-40,P1 跑通后按实际通道名更新)
    eog_channels: ["EXG1", "EXG2", "EXG3", "EXG4"]
    emg_channels: ["EXG5", "EXG6", "EXG7", "EXG8"]

epoching:
  tmin: -3.0                # 基线 3s
  tmax: 60.0                # 刺激 60s
  baseline: [null, 0]       # (None, 0) -> 用刺激前做基线

labels:
  # valence 三分类阈值(DEAP 评分范围 1-9)
  valence_low: 3.5          # <=3.5 -> 消极
  valence_high: 6.5         # >=6.5 -> 积极;中间 -> 中性
  class_names: ["negative", "neutral", "positive"]

features:
  bands:
    theta: [4, 8]
    alpha: [8, 13]
    beta:  [13, 30]
    gamma: [30, 45]
  psd:
    method: "welch"
    n_fft: 256
    n_overlap: 128
  # 额叶不对称对 (左, 右) - 情感识别强特征
  asymmetry_pairs:
    - ["F3", "F4"]
    - ["F7", "F8"]
    - ["FC5", "FC6"]

models:
  cv_folds: 5
  scoring: ["accuracy", "f1_macro"]
  class_weight: "balanced"

transfer:
  strategy: "loso"          # Leave-One-Subject-Out
  methods:
    - "none"                # 基线:无迁移
    - "zscore_per_subject"  # 每被试 z-score
    - "coral"               # CORAL 协方差对齐
  finetune_ratio: 0.1       # 目标域用多少比例微调
